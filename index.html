<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hari Raya Envelope Card</title>
  <style>
    body {
      margin: 0;
      background: #000;
      height: 100vh;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      flex-direction: column;
      position: relative;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .moon-icon, .mosque-icon {
      position: absolute;
      z-index: 1;
      opacity: 0.6;
      animation: float 6s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .envelope-wrapper {
      position: relative;
      width: 300px;
      height: 180px;
      cursor: pointer;
      z-index: 2;
      transition: transform 0.5s ease;
    }

    .envelope-body {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .open {
      transform: translateY(110px);
    }

    .glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,255,120,0.3) 0%, transparent 80%);
      top: 0;
      left: 0;
      z-index: -1;
      filter: blur(10px);
    }

    .letter {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 230px;
      background: white;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      opacity: 0;
      z-index: 1;
    }

    .letter h2 {
      color: green;
      margin: 0;
    }

    .letter p {
      margin: 5px 0;
    }

    .letter img {
      margin-top: 10px;
      width: 100px;
      height: 100px;
    }

    .envelope-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #2e8b57;
      border-radius: 10px;
      z-index: 0;
    }

    .envelope-front {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60%;
      background: #2e8b57;
      border-radius: 0 0 10px 10px;
      z-index: 3;
    }

    .flap {
      position: absolute;
      top: 1px;
      left: 0;
      width: 99%;
      height: 50%;
      background: #3cb371;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.6s ease, z-index 0s 0.6s, top 0.6s ease;
      z-index: 4;
    }

    .open .flap {
      transform: rotateX(180deg);
      top: 5px;
      z-index: 0;
    }

    @keyframes slideUpFade {
      0% {
        bottom: 0;
        opacity: 0;
        transform: translateX(-50%) scale(0.95);
      }
      50% {
        bottom: 80px;
        opacity: 1;
        transform: translateX(-50%) scale(1.05);
      }
      100% {
        bottom: 130px;
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    }

    .open .letter {
      animation: slideUpFade 1s ease-out forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }

    .envelope-wrapper:not(.open) {
      animation: shake 1.5s infinite ease-in-out;
    }

    /* 📱 Responsive styling for mobile */
    @media (max-width: 600px) {
      .envelope-wrapper {
        width: 90vw;
        height: 160px;
      }

      .letter {
        width: 80vw;
        padding: 12px;
      }

      .letter h2 {
        font-size: 20px;
      }

      .letter p {
        font-size: 16px;
      }

      .letter img {
        width: 80px;
        height: 80px;
      }

      .flap {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<!-- Background -->
<div class="background" id="stars-container"></div>

<!-- Envelope -->
<div class="envelope-wrapper" onclick="openEnvelope(this)">
  <div class="letter">
    <h2>Selamat <br> Hari Raya <br> Aidilfitri! 🌙✨</h2>
    <br>
    <p style="font-size: 34px; color: green;">عيد مبارك</p>
    <br><br>
    <p>Scan the QR for duit raya 🥰</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://duit-raya.com" alt="QR Code">
  </div>

  <div class="envelope-body">
    <div class="glow"></div>
    <div class="envelope-back"></div>
    <div class="envelope-front"></div>
    <div class="flap"></div>
  </div>
</div>

<!-- JS -->
<script>
  function openEnvelope(el) {
    el.classList.toggle('open');
  }

  const starsContainer = document.getElementById('stars-container');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    starsContainer.appendChild(star);
  }

  for (let i = 0; i < 6; i++) {
    const moon = document.createElement('div');
    moon.className = 'moon-icon';
    moon.innerText = '🌙';
    moon.style.top = Math.random() * 90 + '%';
    moon.style.left = Math.random() * 100 + '%';
    moon.style.fontSize = (Math.random() * 12 + 16) + 'px';
    document.body.appendChild(moon);
  }

  for (let i = 0; i < 5; i++) {
    const mosque = document.createElement('img');
    mosque.className = 'mosque-icon';
    mosque.src = 'Images/mosque.png'; // replace path as needed
    mosque.style.top = Math.random() * 90 + '%';
    mosque.style.left = Math.random() * 100 + '%';
    mosque.style.width = (Math.random() * 20 + 20) + 'px';
    mosque.style.opacity = 0.5;
    document.body.appendChild(mosque);
  }
</script>

</body>
</html>
